<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pip Learns the Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root { --bg: #fbf3e8; --ink: #3a3632; --soft: #8a8178; --gold: #e9a93b; --rose: #e07a7a; --teal: #6fb7b4; --card: #fffaf1; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Patrick Hand', 'Comic Sans MS', cursive; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; touch-action: pan-x; }
#bars { display: flex; gap: 4px; margin-bottom: 8px; }
#bars i { flex: 1; height: 3px; border-radius: 2px; background: #e4d8c7; overflow: hidden; }
#bars i b { display: block; height: 100%; width: 0; background: var(--ink); }
#bars i.done b { width: 100%; }
#top { display: flex; align-items: baseline; justify-content: space-between; }
#kicker { font-size: 14px; color: var(--soft); letter-spacing: .06em; text-transform: uppercase; }
#count { font-size: 14px; color: var(--soft); }
h1 { margin: 2px 0 6px; font-size: 28px; font-weight: 400; letter-spacing: .02em; }
canvas { width: 100%; aspect-ratio: 400 / 420; display: block; }
#text { flex: 1; font-size: 19px; line-height: 1.38; margin-top: 4px; overflow: auto; }
#text p { margin: 0 0 8px; transition: opacity .5s; }
#text b { font-weight: 400; background: linear-gradient(transparent 58%, #f6d58c 58%); padding: 0 2px; }
#ctl { display: none; align-items: center; gap: 10px; font-size: 18px; margin: 4px 0; }
#ctl input { flex: 1; accent-color: var(--ink); }
#ctl output { width: 40px; text-align: right; }
#hint { text-align: center; font-size: 14px; color: var(--soft); }
.fade { animation: fade .6s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="bars"></div>
  <div id="top"><span id="kicker">TD learning · a story</span><span id="count"></span></div>
  <h1 id="h"></h1>
  <canvas id="cv"></canvas>
  <div id="ctl"><span>γ</span><input id="g" type="range" min="0" max="6" step="1" value="4"><output id="go">0.9</output></div>
  <div id="text"></div>
  <div id="hint">tap the text → next · ← back · tap the picture to replay</div>
</div>
<script src="td_sim.js"></script>
<script>
(() => {
'use strict';
const T = TDSim, W = 400, H = 420, CS = 64, OX = 40, OY = 16;
const C = { ink: '#3a3632', soft: '#8a8178', gold: '#e9a93b', rose: '#e07a7a', teal: '#6fb7b4', card: '#fffaf1', bg: '#fbf3e8', grey: '#b9b0a6', pink: '#f2b8b8' };
const SEED = 35, GAMMAS = [.3, .5, .7, .8, .9, .95, .99];
const runs = {}; const RUN = g => runs[g] ||= T.run({ seed: SEED, gamma: g });
const S9 = RUN(.9), E = S9.eps;
const cx = c => OX + c * CS + CS / 2, cy = r => OY + r * CS + CS / 2;
const lerp = (a, b, u) => a + (b - a) * u, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = u => (u = clamp(u), u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2);
// V after walk e's first i transitions
function Vat(e, i) { const V = e > 0 ? E[e - 1].V.slice() : new Array(20).fill(0); for (let k = 0; k < i; k++) { const t = E[e].tr[k]; V[T.key(t.c, t.r)] = t.nw; } return V; }
const visited = new Set(); E.forEach(e => e.tr.forEach(t => visited.add(T.key(t.c, t.r))));

// ───── hand-drawn helpers (seeded jitter, Rough.js-like) ─────
function rnd(seed) { let a = seed * 9301 + 49297; return () => { a = (a * 9301 + 49297) % 233280; return a / 233280 - .5; }; }
let ctx;
function rline(x1, y1, x2, y2, seed, o = {}) {
  const R = rnd(seed), j = o.j ?? 1.4, p = o.p ?? 1; x2 = lerp(x1, x2, p); y2 = lerp(y1, y2, p);
  ctx.strokeStyle = o.c || C.ink; ctx.lineWidth = o.w || 1.3; ctx.lineCap = 'round';
  for (let k = 0; k < (o.once ? 1 : 2); k++) {
    ctx.beginPath(); ctx.moveTo(x1 + R() * j, y1 + R() * j);
    ctx.quadraticCurveTo((x1 + x2) / 2 + R() * j * 2, (y1 + y2) / 2 + R() * j * 2, x2 + R() * j, y2 + R() * j); ctx.stroke();
  }
}
function rrect(x, y, w, h, seed, o = {}) { rline(x, y, x + w, y, seed, o); rline(x + w, y, x + w, y + h, seed + 1, o); rline(x + w, y + h, x, y + h, seed + 2, o); rline(x, y + h, x, y, seed + 3, o); }
function hachure(x, y, w, h, color, gap, seed, alpha = 1) {
  const R = rnd(seed); ctx.save(); ctx.beginPath(); ctx.rect(x + 2, y + 2, w - 4, h - 4); ctx.clip();
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  for (let d = -h; d < w; d += gap) { ctx.beginPath(); ctx.moveTo(x + d + R() * 2, y + h + R() * 2); ctx.lineTo(x + d + h + R() * 2, y + R() * 2); ctx.stroke(); }
  ctx.restore();
}
function rcircle(x, y, r, seed, o = {}) {
  const R = rnd(seed); ctx.beginPath();
  for (let k = 0; k <= 22; k++) { const a = k / 22 * Math.PI * 2 + .2, rr = r + R() * (o.j ?? 1.2); k ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); } ctx.strokeStyle = o.c || C.ink; ctx.lineWidth = o.w || 1.3; ctx.stroke();
}
function txt(s, x, y, o = {}) { ctx.fillStyle = o.c || C.ink; ctx.globalAlpha = o.a ?? 1; ctx.font = `${o.s || 16}px 'Patrick Hand', cursive`; ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }
function arrow(x1, y1, x2, y2, seed, o = {}) {
  rline(x1, y1, x2, y2, seed, o); const a = Math.atan2(y2 - y1, x2 - x1), L = o.head || 7;
  rline(x2, y2, x2 - L * Math.cos(a - .5), y2 - L * Math.sin(a - .5), seed + 5, o); rline(x2, y2, x2 - L * Math.cos(a + .5), y2 - L * Math.sin(a + .5), seed + 6, o);
}

// ───── characters ─────
function mouse(x, y, face = 1, s = 1, bob = 0) {
  ctx.save(); ctx.translate(x, y + Math.sin(bob * 9) * 1.2); ctx.scale(face * s, s);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(-12, 4); ctx.bezierCurveTo(-24, 6, -22, -8, -28, -4); ctx.stroke(); // tail
  ctx.beginPath(); ctx.ellipse(0, 2, 13, 9, 0, 0, Math.PI * 2); ctx.fillStyle = C.grey; ctx.fill(); ctx.stroke();
  rcircle(4, -8, 5, 3, { fill: C.pink, j: .6 });
  ctx.beginPath(); ctx.ellipse(11, 0, 7, 6, -.3, 0, Math.PI * 2); ctx.fillStyle = C.grey; ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(13, -2, 1.3, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(18, 1.5, 1.6, 0, 7); ctx.fillStyle = '#d97c8c'; ctx.fill();
  ctx.restore();
}
function cheese(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-15, 9); ctx.lineTo(15, 9); ctx.lineTo(15, -3); ctx.lineTo(-15, 9); ctx.moveTo(15, -3); ctx.lineTo(-15, 9);
  ctx.beginPath(); ctx.moveTo(-16, 9); ctx.lineTo(16, 9); ctx.lineTo(16, -6); ctx.closePath(); ctx.fillStyle = '#f7d36b'; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = '#e2b54a'; [[8, 3, 2.4], [12, -1, 1.5], [3, 6, 1.6]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); });
  ctx.restore();
}
function cat(x, y, t, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-13, -4); ctx.lineTo(-11, -17); ctx.lineTo(-4, -9); ctx.moveTo(13, -4); ctx.lineTo(11, -17); ctx.lineTo(4, -9);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3; ctx.fillStyle = '#c9b9a8'; ctx.fill(); ctx.stroke();
  rcircle(0, 0, 13, 41, { fill: '#c9b9a8', j: .8 });
  ctx.beginPath(); ctx.arc(-5, -1, 3, .2, Math.PI - .2); ctx.moveTo(8, -1); ctx.arc(5, -1, 3, .2, Math.PI - .2); ctx.stroke();
  [[-1, 5, -16, 3], [-1, 6, -16, 8], [1, 5, 16, 3], [1, 6, 16, 8]].forEach(([a, b, c, d]) => rline(a, b, c, d, a * 7 + d, { once: true, w: 1, j: .5 }));
  ctx.restore();
  const z = (t * .6) % 1; txt('z', x + 16 + z * 8, y - 16 - z * 12, { s: 13 + z * 5, a: 1 - z, c: C.soft });
}

// ───── the maze scene ─────
function vColor(v) { return v >= 0 ? C.gold : C.rose; }
function maze(o) {
  const p = o.draw ?? 1, V = o.V, t = o.t || 0;
  // value tints (hachure, denser = larger)
  if (V) for (let r = 0; r < T.ROWS; r++) for (let c = 0; c < T.COLS; c++) {
    const v = V[T.key(c, r)]; if (T.term(c, r) || T.isRock(c, r) || Math.abs(v) < .004) continue;
    const m = clamp(Math.abs(v) / .8); hachure(OX + c * CS, OY + r * CS, CS, CS, vColor(v), lerp(13, 4.5, m), 100 + c * 7 + r, lerp(.35, .9, m));
  }
  if (o.hi) o.hi.forEach(([c, r, col, a]) => { ctx.save(); ctx.globalAlpha = a ?? .35; ctx.fillStyle = col; ctx.fillRect(OX + c * CS + 3, OY + r * CS + 3, CS - 6, CS - 6); ctx.restore(); });
  for (let k = 0; k <= T.ROWS; k++) rline(OX, OY + k * CS, OX + T.COLS * CS, OY + k * CS, 10 + k, { p: p >= 1 ? 1 : clamp(p * 1.6 - k * .12), w: k % T.ROWS ? 1 : 1.8, c: k % T.ROWS ? '#b8ab9a' : C.ink });
  for (let k = 0; k <= T.COLS; k++) rline(OX + k * CS, OY, OX + k * CS, OY + T.ROWS * CS, 30 + k, { p: p >= 1 ? 1 : clamp(p * 1.6 - .3 - k * .1), w: k % T.COLS ? 1 : 1.8, c: k % T.COLS ? '#b8ab9a' : C.ink });
  T.ROCKS.forEach(([c, r], i) => { if (p < .8) return; const x = cx(c), y = cy(r); rcircle(x, y + 4, 19, 60 + i, { fill: '#d9d1c6', j: 4 }); hachure(x - 18, y - 13, 36, 34, '#9d9387', 5, 70 + i, .55); });
  if (o.pop?.cheese !== 0) cheese(cx(T.CHEESE[0]), cy(T.CHEESE[1]), o.pop?.cheese ?? 1);
  if (o.pop?.cat !== 0) cat(cx(T.CAT[0]), cy(T.CAT[1]) + 4, t, o.pop?.cat ?? 1);
  if (o.labels) { const a = o.labels; txt('+1 on arrival', cx(4) - 6, cy(0) - 22, { s: 13, c: '#b07d12', a }); txt('−1', cx(3) - 20, cy(1) - 20, { s: 15, c: '#b54b4b', a }); txt('start', cx(0), cy(3) + 24, { s: 13, c: C.soft, a }); }
  if (V && o.nums) for (let r = 0; r < T.ROWS; r++) for (let c = 0; c < T.COLS; c++) {
    if (T.term(c, r) || T.isRock(c, r)) continue; const k = T.key(c, r), a = typeof o.nums === 'function' ? o.nums(c, r) : 1; if (a <= 0) continue;
    const v = V[k], s = Math.abs(v) < .005 ? '0' : String(+v.toFixed(Math.abs(v) < .1 ? 3 : 2));
    txt(s, OX + c * CS + CS - 7, OY + c * 0 + r * CS + 12, { s: 14, al: 'right', a: a * (o.numA?.(c, r) ?? 1), c: v < -.004 ? '#a54444' : v > .004 ? '#8a5d08' : C.soft });
  }
}
function trail(pts, a = .5) { pts.forEach(([c, r], i) => { ctx.globalAlpha = a * (.25 + .75 * i / pts.length); ctx.fillStyle = C.teal; ctx.beginPath(); ctx.arc(cx(c) + ((i * 7) % 13) - 6, cy(r) + ((i * 11) % 13) - 6, 2.2, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; }
// Pip walking along transitions tr[from..to) with dur seconds per step; returns progress info
function walkPos(tr, from, to, t, dur) {
  const k = Math.floor(t / dur), u = ease((t % dur) / dur * 1.4);
  if (k >= to - from) { const l = tr[to - 1]; return { c: l.nc, r: l.nr, x: cx(l.nc), y: cy(l.nr), done: true, k: to - from, face: Math.sign(l.nc - l.c) || 1 }; }
  const s = tr[from + k]; return { x: lerp(cx(s.c), cx(s.nc), u), y: lerp(cy(s.r), cy(s.nr), u), k, s, face: Math.sign(s.nc - s.c) || 0, u };
}
let lastFace = 1; function pip(x, y, face, t) { if (face) lastFace = face; mouse(x, y + 3, lastFace, .95, t); }
// note card with lines that appear one by one
function card(lines, t, o = {}) {
  const x = o.x ?? 30, y = o.y ?? 292, w = o.w ?? 340, lh = 23, h = 18 + lines.length * lh, a = clamp(t * 3);
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.card; ctx.fillRect(x, y, w, h); ctx.restore();
  rrect(x, y, w, h, 200 + lines.length, { c: '#b8ab9a', w: 1.1 });
  lines.forEach((l, i) => { const u = clamp((t - (o.gap ?? 1.1) * i) * 2.5); if (u > 0) txt(l.s ?? l, x + 14, y + 20 + i * lh, { s: 17, al: 'left', a: u, c: l.c }); });
}
function bubble(s, x, y, t, col) { const u = clamp(t * 3), d = clamp(t - 1.2); if (t < 0) return; txt(s, x, y - 14 * ease(u) - d * 6, { s: 20, c: col || '#b07d12', a: u * (1 - d) }); }
function caption(s, a = 1) { txt(s, W / 2, 404, { s: 15, c: C.soft, a }); }
function fmt(v) { return (Math.abs(v) < .1 && v !== 0 ? v.toFixed(3) : v.toFixed(2)).replace(/\.?0+$/, m => m.startsWith('.') && m.length > 1 ? '' : m) || '0'; }
const f2 = v => +v.toFixed(3) + '';

// ───── the steps ─────
const e0 = E[0].tr, e1 = E[1].tr, LEAK = e1.findIndex(t => !t.rew && t.next > 0);
const FIN = E[E.length - 1].V, PATH = T.greedyPath(FIN, .9);
const lens = E.map(e => e.tr.length), ends = E.map(e => e.end);
const surprise = E.map(e => { const l = e.tr[e.tr.length - 1]; return e.end === 1 ? l.target - l.old : null; });
const F1 = e0.findIndex(q => q.nc !== q.c || q.nr !== q.r), K30 = T.key(3, 0), V30 = E.slice(0, 14).map(e => e.V[K30]);
// the "perfect" values along the shortest route: 0.9 ^ (steps to cheese − 1)
const IDEAL = {}; for (let i = 0; i < PATH.length - 1; i++) IDEAL[T.key(...PATH[i])] = .9 ** (PATH.length - 2 - i);
const ZERO = () => new Array(20).fill(0);
function ghost(c, r, s, a = 1, o = {}) { if (o.bg) { ctx.save(); ctx.globalAlpha = .85 * a; ctx.fillStyle = C.card; ctx.fillRect(cx(c) - 28, cy(r) + (o.dy ?? 20) - 9, 56, 18); ctx.restore(); } txt(s, cx(c), cy(r) + (o.dy ?? 20), { s: o.s || 14, c: o.c || '#9a8f84', a }); }
function dim(a = .62) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, 285); ctx.restore(); }
function peek(t, from, to) { const pk = clamp((t - .4) * 1.5) * (1 - clamp((t - 3.2) * 2)); if (pk <= 0) return; to.forEach(([c, r], i) => { const dx = c - from[0], dy = r - from[1]; ctx.globalAlpha = pk; arrow(cx(from[0]) + dx * 14, cy(from[1]) + dy * 14, cx(c) - dx * 14, cy(r) - dy * 14, 300 + i, { c: C.soft }); ctx.globalAlpha = 1; txt('0?', cx(c), cy(r) - 4, { s: 16, c: C.soft, a: pk }); }); }
function car(x, y) { rrect(x - 13, y - 9, 26, 11, 777, { w: 1.2 }); ctx.fillStyle = '#9fc9c7'; ctx.fillRect(x - 12, y - 8, 24, 9); rcircle(x - 7, y + 3, 3, 778, { fill: C.ink, j: .3 }); rcircle(x + 7, y + 3, 3, 779, { fill: C.ink, j: .3 }); }
function commute(t) {
  const y = 362, xs = [52, 150, 252, 350], names = ['office', '10 min in', 'traffic jam!', 'home'];
  rline(40, y, 362, y, 880, { w: 2 }); xs.forEach((x, i) => { rline(x, y - 5, x, y + 5, 881 + i, { w: 1.5 }); txt(names[i], x, y + 18, { s: 14, c: i === 2 ? '#b54b4b' : C.soft }); });
  const seg = [[0, 1.5], [1.5, 3.5], [3.5, 6], [6, 9]]; let x = xs[0];
  if (t > 1.5) x = lerp(xs[0], xs[1], ease((t - 1.5) / 1.5)); if (t > 4) x = lerp(xs[1], xs[2], ease((t - 4) / 1.5));
  car(x, y - 12);
  const say = (s, a, col) => txt(s, W / 2, 312, { s: 18, a, c: col });
  say('at the office: guess 30 min in total', clamp((t - .3) * 2) * (1 - clamp((t - 3) * 2)));
  if (t > 3.2) say('10 gone + 20 to go = still 30', clamp((t - 3.2) * 2) * (1 - clamp((t - 5.6) * 2)), C.soft);
  if (t > 5.8) say('10 gone + 30 to go = 40!  update now', clamp((t - 5.8) * 2), '#b54b4b');
  if (t > 7.5) txt('no need to wait until you get home', W / 2, 408, { s: 14, c: C.soft, a: clamp(t - 7.5) });
}
function walkChart(n) {
  const x0 = 60, x1 = 360, y0 = 392, y1 = 300, X = i => x0 + i * (x1 - x0) / 13, Y = v => y0 - v * (y0 - y1);
  rline(x0 - 8, y0, x1 + 6, y0, 960, { c: '#b8ab9a', w: 1 }); rline(x0 - 8, Y(1), x1 + 6, Y(1), 961, { c: '#e4d8c7', w: 1, once: true });
  txt('1', x0 - 22, Y(1) + 4, { s: 12, c: C.soft }); txt('0', x0 - 18, y0, { s: 12, c: C.soft }); txt('guess for the cell beside the cheese, after each walk', x0 - 20, y1 - 12, { s: 14, al: 'left', c: C.soft });
  for (let i = 0; i < n && i < V30.length; i++) {
    if (i) rline(X(i - 1), Y(V30[i - 1]), X(i), Y(V30[i]), 970 + i, { c: '#c99a3a', w: 1.4, once: true });
    const cat = ends[i] < 0; ctx.fillStyle = cat ? C.rose : C.gold; ctx.beginPath(); ctx.arc(X(i), Y(V30[i]), 3.6, 0, 7); ctx.fill();
    if ([0, 1, 2, 7, 8, 13].includes(i)) txt(String(+V30[i].toFixed(2)), X(i), Y(V30[i]) - 11, { s: 13, c: cat ? '#b54b4b' : '#8a5d08' });
    if (cat) txt('cat!', X(i) + 18, Y(V30[i]) + 10, { s: 13, c: '#b54b4b' });
  }
}
function arrowsOn(V, g, t0, t) { let n = 0; for (let r = 0; r < T.ROWS; r++) for (let c = 0; c < T.COLS; c++) { const k = T.key(c, r); if (T.term(c, r) || T.isRock(c, r)) continue;
  if (Math.abs(V[k]) < .004) { txt('?', cx(c), cy(r) + 4, { s: 18, c: '#c2b6a6', a: clamp(t - t0 - 2.6) }); continue; }
  const a = clamp((t - t0 - n++ * .18) * 3); if (a <= 0) continue; const [dx, dy] = T.MOVES[T.greedy(V, c, r, g)]; ctx.globalAlpha = a; arrow(cx(c) - dx * 9, cy(r) - dy * 9 + 4, cx(c) + dx * 15, cy(r) + dy * 15 + 4, 400 + k, { c: '#8a5d08', w: 1.5 }); ctx.globalAlpha = 1; } }

const STEPS = [
 { h: 'Meet Pip', p: ['Pip is a mouse in a small maze. In the top corner sits a piece of **cheese**: stepping onto it pays +1. Near it sleeps a **cat**: stepping onto it costs −1. Either one ends the walk.', 'Pip has never seen this maze before.'],
   draw(t) { maze({ draw: t / 1.6, pop: { cheese: ease((t - 1.8) * 3), cat: ease((t - 2.3) * 3) }, labels: clamp(t - 3), t }); if (t > 2.8) pip(cx(0), cy(3), 1, t); caption('two rocks block the middle', clamp(t - 3.5)); } },
 { h: 'What Pip wants to know', p: ['Pip wants a notebook with one number per cell, answering: **starting from here, how much reward can I expect?** That number is the cell’s **value**.', 'Pip knows nothing yet, so every guess starts at 0.'],
   draw(t) { maze({ V: ZERO(), nums: (c, r) => clamp((t - .5 - (r * 5 + c) * .12) * 3), t }); pip(cx(0), cy(3), 1, t); caption('small number in each corner = Pip’s current guess', clamp(t - 3)); } },
 { h: 'What the right answer looks like', p: ['Suppose Pip already knew the shortest way. The +1 is paid for the step **onto** the cheese, and the walk ends there. So the cheese cell itself needs no number: nothing comes after it. The cell next to it gets the +1 on its very next step: value 1.', 'One cell further, the +1 comes one step later, and later rewards count a bit less. Each extra step multiplies by **γ (gamma)**, here 0.9. So the values go 1, 0.9, 0.81, and so on, down to 0.53 at the start. Pip doesn’t know these numbers. It has to discover them.'],
   draw(t) { maze({ V: ZERO(), t, numA: () => .35, nums: 1 });
     const R = PATH.slice(0, -1).reverse(); R.forEach(([c, r], i) => { const a = clamp((t - .8 - i * .9) * 2); if (a <= 0) return; ghost(c, r, String(+IDEAL[T.key(c, r)].toFixed(2)), a, { dy: 6, s: 19, c: '#8a5d08' });
 });

     if (t > 7.5) card(['start: 0.9 × 0.9 × 0.9 × 0.9 × 0.9 × 0.9 = 0.53', { s: 'six extra steps, six times 0.9', c: C.soft }], t - 7.5, { gap: .7 }); } },
 { h: 'Learn now, not later', p: ['Pip could wait until a walk ends and only then judge every cell it passed. But it can learn after **every single step**.', 'Think of driving home. You guess 30 minutes. Ten minutes in, you hit a traffic jam, so you revise: 40 minutes. You learned something before you got home. That is the idea behind **temporal-difference learning**, or TD learning.'],
   draw(t) { maze({ V: ZERO(), t }); pip(cx(0), cy(3), 1, t); dim(); commute(t); } },
 { h: 'The update, in words', p: ['After each step, Pip looks back at the cell it just **left** and asks: what did that step pay me, plus 0.9 times what the cell I landed on is worth?', 'That sum is the **target**. It beats the old guess because it contains one real, observed step.'],
   draw(t) { const s = e0[F1]; maze({ V: ZERO(), nums: 1, t, hi: [[s.c, s.r, C.teal, .22], [s.nc, s.nr, C.gold, .18 * clamp(t - 1)]] });
     const m = walkPos(e0, F1, F1 + 1, clamp(t - .3, 0, 1), 1); pip(m.x, m.y, 1, t); ghost(s.c, s.r, 'left', clamp(t - 1.2), { dy: -18, s: 14 }); ghost(s.nc, s.nr, 'landed', clamp(t - 1.6), { dy: -18, s: 14 });
     card(['target  =  reward for the step', '             +  0.9 × guess for where I landed', { s: 'then nudge the left cell’s guess toward it', c: C.soft }], t - 2.2, { gap: 1.3 }); } },
 { h: 'How Pip picks a move', p: ['To move, Pip peeks at the neighbouring cells and goes to the one with the best guess.', 'But one move in five is random. Without those random moves Pip would repeat its first habits forever and never find a better route. This is called **exploring**. Right now every guess is 0, so every move is a coin toss.'],
   draw(t) { maze({ V: ZERO(), nums: 1, t }); pip(cx(0), cy(3), 1, t); peek(t + .0, [0, 3], [[1, 3], [0, 2]]);
     if (t > 3.6) card(['best guess: tie (0 and 0), so pick either', { s: 'and 1 move in 5: any direction, at random', c: C.soft }], t - 3.6, { gap: .9 }); } },
 { h: 'Step 1: nothing to learn yet', p: ['Pip moves right. No reward, and the new cell’s guess is 0.', 'Target = 0 + 0.9 × 0 = 0. The old guess was 0 too, so nothing changes.'],
   draw(t) { const s = e0[F1]; maze({ V: ZERO(), nums: 1, t, hi: t > 1.3 ? [[s.c, s.r, C.teal, .25]] : null }); const m = walkPos(e0, F1, F1 + 1, clamp(t - .3, 0, 1), 1); pip(m.x, m.y, m.face || 1, t);
     if (t > 1.4) card(['reward 0  +  0.9 × 0   =   target 0', 'old guess 0   →   stays 0'], t - 1.4, { gap: 1.2 }); } },
 { h: 'Wandering', p: ['Pip keeps going, updating one cell per step. Step after step, every update says “0 stays 0”.', 'TD learning passes news from cell to cell, but there is no news yet: Pip has not met a single reward. The teal dots are its footprints.'],
   draw(t) { const n = e0.length - 1, m = walkPos(e0, F1 + 1, n, t, .55); trail(e0.slice(0, F1 + 1 + m.k).map(s => [s.c, s.r])); maze({ V: ZERO(), nums: 1, t }); pip(m.x, m.y, m.face, t);
     caption(`step ${Math.min(n, F1 + 1 + m.k + (m.done ? 0 : 1))} of the first walk`); } },
 { h: 'Cheese!', p: ['On step 14 Pip lands on the cheese: reward +1, and the walk ends, so there is no “next cell” to add. The target for the cell it left is simply 1. Its old guess was 0.', 'The gap, target minus old guess, is the **TD error**: how surprised Pip is. Here the surprise is 1.'],
   draw(t) { const l = e0[e0.length - 1]; trail(e0.map(s => [s.c, s.r]), .3); maze({ V: ZERO(), nums: 1, t, hi: t > 2 ? [[l.c, l.r, C.gold, .3]] : null });
     const m = walkPos(e0, e0.length - 1, e0.length, Math.max(0, t - .6), 1); pip(m.x, m.y, m.face || 1, t); bubble('+1', cx(4), cy(0) - 18, t - 1.4);
     if (t > 2.2) card(['target  =  1   (walk over: nothing to add)', 'old guess  =  0', { s: 'TD error  =  1 − 0  =  1     surprise!', c: '#8a5d08' }], t - 2.2, { gap: 1.3 }); } },
 { h: 'Only a fifth of the way', p: ['Pip doesn’t jump straight to 1. It moves its guess a fifth of the way toward the target: 0 + 0.2 × 1 = 0.2. That 0.2 is **α (alpha)**, the **learning rate**.', 'Why so cautious? One walk can be a fluke. Small steps let many walks average out.'],
   draw(t) { const l = e0[e0.length - 1], V = ZERO(); V[T.key(l.c, l.r)] = l.nw * ease((t - 4.6) / 1.2); maze({ V, nums: 1, t, hi: [[l.c, l.r, C.gold, .3]] }); pip(cx(4), cy(0), 1, t);
     card(['new guess  =  old  +  α × TD error', '                =  0  +  0.2 × 1  =  0.2', { s: 'α = 0.2: move one fifth of the way', c: C.soft }], t - .5, { gap: 1.5 }); } },
 { h: 'The news travels back', p: ['Walk 2. Pip steps from the cell on the left into the 0.2 cell. No reward this time, but the target uses the neighbour’s guess: 0 + 0.9 × 0.2 = 0.18. A fifth of that: the left cell becomes 0.036.', 'Learning a guess from another guess is called **bootstrapping**. It is the heart of TD learning.'],
   draw(t) { const fast = .11, t1 = LEAK * fast, s = e1[LEAK]; let m, V = Vat(1, 0);
     if (t < t1) m = walkPos(e1, 0, LEAK, t, fast); else { m = walkPos(e1, LEAK, LEAK + 1, Math.min(1, t - t1), 1); V = Vat(1, LEAK); V[T.key(s.c, s.r)] = s.nw * ease((t - t1 - 5.2) / 1); }

     maze({ V, nums: 1, t, hi: t > t1 + 1 ? [[s.c, s.r, C.teal, .22], [s.nc, s.nr, C.gold, .2]] : null }); pip(m.x, m.y, m.face, t);
     if (t < t1) caption('walk 2 (sped up)'); else card(['reward 0  +  0.9 × 0.2   =   target 0.18', 'new  =  0 + 0.2 × (0.18 − 0)  =  0.036', { s: 'the news moved one cell back', c: '#8a5d08' }], t - t1 - 1.1); } },
 { h: 'Small steps add up', p: ['Each walk nudges the cell beside the cheese up: 0.2, 0.36, 0.44 … 0.82 after 8 walks.', 'On walk 9 a random move sends Pip into the cat: target −1, and the guess drops to 0.45. Because each walk only moves it a fifth of the way, the good walks outvote the bad one: by walk 14 it is back at 0.8.'],
   draw(t) { const n = clamp(Math.floor(t / .7) + 1, 1, 14); maze({ V: E[n - 1].V, nums: 1, t, hi: [[3, 0, C.gold, .25]] }); pip(cx(ends[n - 1] > 0 ? 4 : 3), cy(ends[n - 1] > 0 ? 0 : 1), 1, t); walkChart(n); } },
 { h: '200 walks later', p: ['Repeat for 200 walks. The good news spreads backward from the cheese, one cell at a time, and Pip’s walks get shorter.', 'Its first walks took 14, 33, 68 and 73 steps. Soon most take about 8 to 10. A rose bar means the cat won. Cells Pip never visits keep their 0.'],
   draw(t) { let w, k; if (t < 6) { w = 2 + Math.floor(t / .75); k = (t % .75) / .75; } else { w = 10 + Math.floor((t - 6) / .05); k = ((t - 6) % .05) / .05; }
     const done = w >= E.length; if (done) { w = E.length - 1; k = 1; }
     const tr = E[w].tr, i = Math.min(tr.length - 1, Math.floor(k * tr.length)), q = tr[i];
     maze({ V: done ? FIN : Vat(w, i), nums: 1, t }); pip(done ? cx(4) : cx(q.c), done ? cy(0) : cy(q.r), 1, t);
     strip(lens, ends, done ? E.length : w, 'steps per walk', 80); caption(done ? 'walk 200 of 200' : `walk ${w + 1} of 200`); } },
 { h: 'Why not 1, 0.9, 0.81?', p: ['Compare with the perfect numbers: beside the cheese Pip learned 0.8, not 1. That is not a mistake.', 'Values describe Pip’s real habits. One move in five is random, random moves waste steps, and from that cell about 1 move in 20 lands on the cat. TD learns how good a cell is **for the walker Pip actually is**.'],
   draw(t) { maze({ V: FIN, nums: 1, t }); pip(cx(0), cy(3), 1, t); const a = clamp(t - .8);
     Object.keys(IDEAL).forEach(k => { const c = k % 5, r = Math.floor(k / 5); ghost(c, r, 'perfect ' + (+IDEAL[k].toFixed(2)), a, { dy: 20, s: 13, bg: 1, c: '#6d645b' }); });
     if (t > 2.5) card(['beside the cheese:  learned 0.8,  perfect 1', { s: 'perfect = +1 on the very next step, every time', c: C.soft }, { s: '1 in 5 moves random  ·  1 in 20 hits the cat', c: C.soft }], t - 2.5, { gap: .9 }); } },
 { h: 'Read the map', p: ['Turn the notebook into a plan: from each cell, point to the best-looking neighbour. Following the arrows, Pip reaches the cheese in 7 steps, the shortest route. A “?” marks a cell that never got useful news.', 'This works because Pip knows which cell each move leads to. Without that knowledge you would learn a value for each move instead, as Q-learning does.'],
   draw(t) { maze({ V: FIN, nums: 1, t }); arrowsOn(FIN, .9, .4, t);
     const t2 = t - 3.6, kk = clamp(Math.floor(t2 / .7), 0, PATH.length - 1), u = ease((t2 % .7) / .7 * 1.3), a = PATH[kk], b = PATH[Math.min(PATH.length - 1, kk + 1)];
     if (t2 > 0) trail(PATH.slice(0, kk + 1), .7);
     pip(t2 > 0 ? lerp(cx(a[0]), cx(b[0]), u) : cx(0), t2 > 0 ? lerp(cy(a[1]), cy(b[1]), u) : cy(3), t2 > 0 ? (b[0] - a[0]) : 1, t);
     if (t2 > 0) caption(`following the arrows: ${Math.min(kk + (kk < PATH.length - 1 && u > .5 ? 1 : 0), PATH.length - 1)} steps`); } },
 { h: 'Your turn', ctl: true, p: ['Drag **γ** to rerun all 200 walks. With a small γ, a far-away cheese barely counts, so the values fade quickly away from it.', 'Tap any cell to drop Pip there and watch it follow the arrows. In the corner it never explored, it has no clue which way to go.'],
   draw(t, st) { const g = GAMMAS[st.gi ?? 4], Rn = RUN(g), V1 = Rn.eps[Rn.eps.length - 1].V, prev = st.prevV || V1, u = ease((t - (st.changed ?? -9)) / .9);
     const V = V1.map((v, i) => lerp(prev[i], v, u)); maze({ V, nums: 1, t });
     for (let r = 0; r < T.ROWS; r++) for (let c = 0; c < T.COLS; c++) { if (T.term(c, r) || T.isRock(c, r) || Math.abs(V1[T.key(c, r)]) < .004) continue; const [dx, dy] = T.MOVES[T.greedy(V1, c, r, g)]; ctx.globalAlpha = .45; arrow(cx(c) - dx * 9, cy(r) - dy * 9 + 4, cx(c) + dx * 13, cy(r) + dy * 13 + 4, 500 + c * 5 + r, { c: '#8a5d08', w: 1.2 }); ctx.globalAlpha = 1; }
     const P = st.path; if (P) { const t2 = t - st.pt, kk = clamp(Math.floor(t2 / .45), 0, P.length - 1), uu = ease((t2 % .45) / .45 * 1.3), a = P[kk], b = P[Math.min(P.length - 1, kk + 1)];
       trail(P.slice(0, kk + 1), .7); pip(lerp(cx(a[0]), cx(b[0]), uu), lerp(cy(a[1]), cy(b[1]), uu), b[0] - a[0], t);
       caption(kk >= P.length - 1 ? (st.why ? (P.length > 1 ? `after ${P.length - 1} steps: ` : '') + st.why : `reached the ${T.term(...P[P.length - 1]) > 0 ? 'cheese' : 'cat'} in ${P.length - 1} steps`) : `step ${kk}`);
     } else { pip(cx(0), cy(3), 1, t); caption('tap a cell to drop Pip there'); }
     txt(g <= .5 ? 'only cells right next to the cheese care about it' : g >= .95 ? 'even far cells feel the cheese (and the cat)' : 'the cheese’s pull fades with distance', W / 2, 312, { s: 17, c: C.soft }); } },
 { h: 'Where you’ve seen this', p: ['Pip’s surprise at the cheese fades toward 0 as the guess beside it climbs. Each rose tick is a walk where Pip stumbled into the cat from that cell: the guess drops, and the surprise comes back.', 'In the 1990s, scientists found that **dopamine** neurons fire much like a TD error. And TD learning powered TD-Gammon (1992), a backgammon program that learned by playing itself.'],
   draw(t) { maze({ V: FIN, nums: 1, t }); pip(cx(3), cy(0), 1, t); const n = Math.min(E.length, Math.floor(t * 30));
     strip(surprise.map(v => v == null ? null : v * 80), ends, n, 'surprise at the cheese, walk by walk', 80, true); caption(n >= E.length ? 'gold = surprise at the cheese · rose = met the cat' : ''); } },
 { h: 'Recap', p: ['A **value** is the reward still to come from a cell. TD learning improves each guess after every step, using the reward it just saw plus the next cell’s guess.', 'Repeat that enough, and good news spreads backward until the notebook becomes a map.'],
   draw(t) { maze({ V: FIN, nums: 1, t }); arrowsOn(FIN, .9, -5, t + 10); pip(cx(0), cy(3), 1, t);
     card(['target  =  reward  +  γ × next cell’s guess', 'TD error  =  target − old guess', 'new guess  =  old  +  α × TD error', { s: 'γ = 0.9 how much later counts · α = 0.2 step size', c: C.soft }], t - .3, { gap: 1 }); } },
];

// Pip follows its notebook from a cell; stops if every neighbour looks the same (no clue) or it loops
function follow(V, g, from) {
  let [c, r] = from; const P = [[c, r]], seen = new Set([T.key(c, r)]);
  while (!T.term(c, r) && P.length < 30) {
    const qs = []; for (let m = 0; m < 4; m++) { const [nc, nr] = T.step(c, r, m); if (nc === c && nr === r) continue; const rw = T.term(nc, nr); qs.push(rw + (rw ? 0 : g * V[T.key(nc, nr)])); }
    if (Math.max(...qs) - Math.min(...qs) < 1e-9) return { P, why: 'no clue here: every direction looks the same' };
    [c, r] = T.step(c, r, T.greedy(V, c, r, g)); P.push([c, r]);
    if (seen.has(T.key(c, r))) return { P, why: 'going in circles' }; seen.add(T.key(c, r));
  }
  return { P, why: null };
}
// small chart under the maze (walk lengths or surprises)
function strip(vals, ends, n, label, max, dots) {
  const x0 = 40, x1 = 360, y0 = 384, y1 = 300, w = (x1 - x0) / vals.length;
  rline(x0, y0, x1, y0, 900, { c: '#b8ab9a', w: 1 }); txt(label, x0, y1 - 2, { s: 14, al: 'left', c: C.soft });
  for (let i = 0; i < n; i++) { const v = vals[i]; if (v == null && !(dots && ends[i] < 0)) continue; const h = Math.min(max, v) / max * (y0 - y1 - 14);
    if (dots && ends[i] < 0) { rline(x0 + i * w + w / 2, y0 + 2, x0 + i * w + w / 2, y1 + 10, 950 + i, { c: C.rose, w: 1.2, once: true, j: .6 }); continue; }
    if (dots) { ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(x0 + i * w + w / 2, y0 - h, 2.1, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = ends[i] > 0 ? C.teal : C.rose; ctx.fillRect(x0 + i * w + .2, y0 - h, Math.max(1, w - .5), h); } }
  if (!dots) { txt('1', x0, y0 + 10, { s: 12, c: C.soft }); txt('200', x1, y0 + 10, { s: 12, c: C.soft }); }
  else { txt('1.0', x0 - 14, y0 - (y0 - y1 - 14), { s: 12, c: C.soft }); txt('0', x0 - 10, y0, { s: 12, c: C.soft }); }
}

// ───── app shell ─────
const cv = document.getElementById('cv'), $h = document.getElementById('h'), $t = document.getElementById('text'), $bars = document.getElementById('bars'), $ctl = document.getElementById('ctl'), $g = document.getElementById('g'), $go = document.getElementById('go'), $count = document.getElementById('count');
$bars.innerHTML = STEPS.map(() => '<i><b></b></i>').join('');
let cur = 0, t0 = performance.now(), st = {};
const md = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function go(i) {
  cur = clamp(i, 0, STEPS.length - 1); t0 = performance.now(); const prevG = st.gi; st = { gi: prevG ?? 4 };
  const s = STEPS[cur]; $h.textContent = s.h; $h.className = 'fade'; $t.innerHTML = s.p.map(p => `<p>${md(p)}</p>`).join(''); $t.className = 'fade';
  void $h.offsetWidth; $ctl.style.display = s.ctl ? 'flex' : 'none'; $count.textContent = `${cur + 1} / ${STEPS.length}`;
  [...$bars.children].forEach((b, k) => b.className = k < cur ? 'done' : ''); try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
}
function resize() { const d = Math.min(3, devicePixelRatio || 1); cv.width = W * d; cv.height = H * d; }
function frame(now) {
  const t = (now - t0) / 1000; ctx = cv.getContext('2d'); const d = cv.width / W; ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  try { STEPS[cur].draw(t, st); } catch (e) { console.error(e); }
  const b = $bars.children[cur]?.firstChild; if (b) b.style.width = Math.min(100, t / 14 * 100) + '%';
  requestAnimationFrame(frame);
}
$g.addEventListener('input', () => { const R0 = RUN(GAMMAS[st.gi ?? 4]); st.prevV = R0.eps[R0.eps.length - 1].V; st.gi = +$g.value; $go.textContent = GAMMAS[st.gi]; st.changed = (performance.now() - t0) / 1000; st.path = null; });
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (STEPS[cur].ctl) { const c = Math.floor((x - OX) / CS), rr = Math.floor((y - OY) / CS);
    if (c >= 0 && c < T.COLS && rr >= 0 && rr < T.ROWS && !T.isRock(c, rr) && !T.term(c, rr)) { const g = GAMMAS[st.gi ?? 4], Rn = RUN(g); const f = follow(Rn.eps[Rn.eps.length - 1].V, g, [c, rr]); st.path = f.P; st.why = f.why; st.pt = (performance.now() - t0) / 1000; }
    return; }
  const keep = st.gi; t0 = performance.now(); st = { gi: keep };
});
$t.addEventListener('click', e => { const r = $t.getBoundingClientRect(); go(cur + (e.clientX - r.left < r.width * .3 ? -1 : 1)); });
let sx = null, sy = null;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => { if (sx == null || e.target === $g) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1)); else if (Math.abs(dy) > 60) go(cur + (dy < 0 ? 1 : -1)); sx = null; });
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') go(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1); });
addEventListener('resize', resize); resize();
go((+location.hash.slice(1) || 1) - 1); requestAnimationFrame(frame);
window.__td = { go, STEPS, get cur() { return cur; }, setT(s) { t0 = performance.now() - s * 1000; } };
})();
