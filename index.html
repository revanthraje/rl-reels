<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1122">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RL Reels</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="side">
    <button id="btnAuto" title="Autoplay on/off"><span id="autoIco">▶</span><small id="autoLab">Manual</small></button>
    <button id="btnAudio" title="Sound: voice / effects / off"><span id="audIco">🔊</span><small id="audLab">Voice</small></button>
    <button id="btnLike" title="Like"><span id="likeIco">🤍</span><small>Like</small></button>
    <button id="btnLib" title="All topics (L)"><span>📚</span><small id="memCount">0</small></button>
    <button id="btnAgain" title="Show this again later"><span>↻</span><small>Again</small></button>
  </div>
  <div id="toast"></div>
</div>

<div id="lib" class="sheet hidden">
  <div class="sheet-head">
    <h2>Your RL map</h2>
    <button class="close" data-close="lib">✕</button>
  </div>
  <div id="libStats"></div>
  <div id="libBody"></div>
  <div class="lib-foot">
    <button id="btnExport">Export memory</button>
    <button id="btnImport">Import</button>
    <button id="btnReset" class="danger">Reset</button>
    <input id="fileImport" type="file" accept="application/json" hidden>
  </div>
</div>

<script src="anim.js"></script>
<script src="topics.js"></script>
<script src="app.js"></script>
</body>
</html>
